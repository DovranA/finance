deployments:
  enabled: true
  apps:
    finance-api:
      replicaCount: 1
    finance-inbox-worker:
      replicaCount: 1
    finance-batch-worker:
      replicaCount: 1

ingress:
  enabled: true
  rules:
    finance-api:
      enabled: true
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: 5120m
        nginx.ingress.kubernetes.io/proxy-connect-timeout: '3600'
        nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
        nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
      ingressClassName: nginx
      hosts:
        - host: finance.tmbiz.info
          paths:
            - path: /
              pathType: ImplementationSpecific
              service:
                name: finance-api
                port: 8000
      tls:
        - secretName: tls-tmbiz.info
          hosts:
            - finance.tmbiz.info