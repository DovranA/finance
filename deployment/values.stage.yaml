deployments:
  enabled: true
  apps:
    finance-api:
      replicaCount: 1
    finance-inbox-worker:
      replicaCount: 1
    finance-batch-worker:
      replicaCount: 1

ingress:
  enabled: true
  rules:
    finance-api:
      enabled: true
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: 5120m
        nginx.ingress.kubernetes.io/proxy-connect-timeout: '3600'
        nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
        nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
      ingressClassName: nginx
      hosts:
        - host: dev-finance.tmbiz.info
          paths:
            - path: /
              pathType: ImplementationSpecific
              service:
                name: finance-api
                port: 8000
      tls:
        - secretName: tls-tmbiz.info
          hosts:
            - dev-finance.tmbiz.info
secrets:
  finance-api:
    annotations:
      vault.security.banzaicloud.io/vault-role: "finance-59-prod"
      vault.security.banzaicloud.io/vault-addr: "https://vault.tmbiz.info"
      vault.security.banzaicloud.io/vault-tls-secret: "vault.tmbiz.info-tls"
    data:
      API_KEY: vault:applications/data/tmbiz-info/finance/app#API_KEY
      APP_ENABLE_INBOX_CONSUMER: vault:applications/data/tmbiz-info/finance/app#APP_ENABLE_INBOX_CONSUMER
      APP_ENV: vault:applications/data/tmbiz-info/finance/app#APP_ENV
      APP_HOST: vault:applications/data/tmbiz-info/finance/app#APP_HOST
      APP_LOG_LEVEL: vault:applications/data/tmbiz-info/finance/app#APP_LOG_LEVEL
      APP_NAME: vault:applications/data/tmbiz-info/finance/app#APP_NAME
      APP_PORT: vault:applications/data/tmbiz-info/finance/app#APP_PORT
      BATCH_INTERVAL_SECONDS: vault:applications/data/tmbiz-info/finance/app#BATCH_INTERVAL_SECONDS
      BATCH_SIZE: vault:applications/data/tmbiz-info/finance/app#BATCH_SIZE
      FASTAPI_CORS_CREDENTIALS: vault:applications/data/tmbiz-info/finance/app#FASTAPI_CORS_CREDENTIALS
      FASTAPI_CORS_ORIGINS: vault:applications/data/tmbiz-info/finance/app#FASTAPI_CORS_ORIGINS
      GUNICORN_LOG_LEVEL: vault:applications/data/tmbiz-info/finance/app#GUNICORN_LOG_LEVEL
      GUNICORN_TIMEOUT: vault:applications/data/tmbiz-info/finance/app#GUNICORN_TIMEOUT
      GUNICORN_WORKERS: vault:applications/data/tmbiz-info/finance/app#GUNICORN_WORKERS
      JWT_SECRET_KEY: vault:applications/data/tmbiz-info/finance/app#JWT_SECRET_KEY
      JWT_SERVICE_API_KEY: vault:applications/data/tmbiz-info/finance/app#JWT_SERVICE_API_KEY
