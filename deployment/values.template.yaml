deployments:
  enabled: true
  apps:
    finance-api:
      replicaCount: 1
      containers:
        - name: finance-api
          image: ${CI_REGISTRY}/applications/${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA}
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: finance-api
          ports:
          - containerPort: 8000
    finance-inbox-worker:
      replicaCount: 1
      containers:
        - name: finance-inbox-worker
          image: ${CI_REGISTRY}/applications/${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA}
          imagePullPolicy: IfNotPresent
          command: 
            - python
            - -m
            - app.infrastructure.rabbitmq.inbox_consumer
          envFrom:
            - secretRef:
                name: finance-inbox-worker
          ports:
          - containerPort: 8000
    finance-batch-worker:
      replicaCount: 1
      containers:
        - name: finance-batch-worker
          image: ${CI_REGISTRY}/applications/${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA}
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - app.infrastructure.rabbitmq.batch_worker
            - --env-file
            - /dev/null
          envFrom:
            - secretRef:
                name: finance-batch-worker
          ports:
          - containerPort: 8000



services:
  enabled: true
  rules:
    finance-api:
      deployment: finance-api
      ports:
        - name: http
          protocol: TCP
          port: 8000
          targetPort: 8000
    finance-inbox-worker:
      deployment: finance-inbox-worker
      ports:
        - name: http
          protocol: TCP
          port: 8000
          targetPort: 8000
    finance-batch-worker:
      deployment: finance-batch-worker
      ports:
        - name: http
          protocol: TCP
          port: 8000
          targetPort: 8000



