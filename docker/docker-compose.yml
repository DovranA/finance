  #     DEBEZIUM_PUBLICATION_NAME: ${DEBEZIUM_PUBLICATION_NAME:-finance_outbox_pub}
  #     RABBITMQ_HOST: rabbitmq
  #     RABBITMQ_PORT: 5672
  #     RABBITMQ_USER: ${RABBITMQ_USER:-guest}
  #     RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
  #     RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-finance}
  #     QUARKUS_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}

  redisinsight-finance:
    image: redis/redisinsight:latest
    container_name: ${DOCKER_COMPOSE_PROJECT_NAME:-finance}-redisinsight-1
    ports:
      - 5540:5540
    networks:
      - finance-network
    depends_on:
      - redis

  # ── Prometheus ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: finance-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_storage:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - finance-network
    depends_on:
      - finance-api
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Grafana ────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: finance-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - finance-network
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  debeziumdata:
  prometheus_storage:
  grafana_storage:

networks:
  finance-network:
    driver: bridge
